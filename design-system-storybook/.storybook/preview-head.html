<!-- Google Analytics 4 (GA4) Tracking -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-02V3ZNFL0V"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-02V3ZNFL0V', {
    send_page_view: true
  });

  // Track Storybook story route navigation (hashchange & popstate)
  function trackStoryNavigation() {
    if (typeof gtag === 'function') {
      gtag('event', 'page_view', {
        page_title: document.title,
        page_location: window.location.href,
        page_path: window.location.pathname + window.location.search + window.location.hash
      });
    }
  }

  window.addEventListener('hashchange', trackStoryNavigation);
  window.addEventListener('popstate', trackStoryNavigation);
</script>

<!-- Web Audio API & HTML5 Audio Sound Effects (Realistic Meow) -->
<script>
  (function() {
    // Reliable MP3 cat meow sound
    const meowAudio = new Audio('https://cdn.freesound.org/previews/415/415209_5121236-lq.mp3');
    meowAudio.volume = 0.5;

    function playRealMeow() {
      try {
        const soundClone = meowAudio.cloneNode();
        soundClone.volume = 0.5;
        soundClone.play().catch(function(e) {
          // If HTML5 Audio fails, fallback to synthesizer meow
          playSynthMeow();
        });
      } catch (err) {
        playSynthMeow();
      }
    }

    let audioCtx = null;
    function initSynthAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSynthMeow() {
      const ctx = initSynthAudio();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
        osc.frequency.exponentialRampToValueAtTime(450, now + 0.4);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.5, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    // Play meow sound on any click
    window.addEventListener('click', function() {
      playRealMeow();
    }, true);

    // Also trigger on storybook manager framing window
    window.storybookSoundFx = {
      meow: playRealMeow,
      click: playRealMeow
    };
  })();
</script>
