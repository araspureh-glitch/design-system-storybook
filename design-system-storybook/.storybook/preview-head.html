<!-- Google Analytics 4 (GA4) Tracking -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-02V3ZNFL0V"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-02V3ZNFL0V', {
    send_page_view: true
  });

  // Track Storybook story route navigation (hashchange & popstate)
  function trackStoryNavigation() {
    if (typeof gtag === 'function') {
      gtag('event', 'page_view', {
        page_title: document.title,
        page_location: window.location.href,
        page_path: window.location.pathname + window.location.search + window.location.hash
      });
    }
  }

  window.addEventListener('hashchange', trackStoryNavigation);
  window.addEventListener('popstate', trackStoryNavigation);
</script>

<!-- Web Audio API Global Sound Effects for Interactive Elements -->
<script>
  (function() {
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Resume/unlock audio context on initial user click or keypress
    ['click', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, function unlock() {
        initAudio();
        window.removeEventListener(evt, unlock);
      }, { once: true });
    });

    function playMeowSound() {
      const ctx = initAudio();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        // Frequency sweep mimicking "me-ow": 650Hz -> 950Hz -> 400Hz
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(950, now + 0.12);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.35);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.35, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.35);
      } catch (err) {
        console.warn('Audio error:', err);
      }
    }

    function playHoverSound() {
      const ctx = initAudio();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(550, now + 0.04);

        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.04);
      } catch (err) {}
    }

    // Play MEOW sound on ANY click in the preview frame
    document.addEventListener('click', function(e) {
      playMeowSound();
    }, true);

    // Play hover sound on interactive elements
    document.addEventListener('mouseover', function(e) {
      const target = e.target.closest('button, a, input, select, [role="button"], div, span, svg');
      if (target && target !== document.body && target !== document.documentElement) {
        const style = window.getComputedStyle(target);
        if (style.cursor === 'pointer' || target.onclick || target.tagName === 'BUTTON' || target.tagName === 'A') {
          playHoverSound();
        }
      }
    }, true);

    // Expose soundFx globally on window for manual story testing
    window.storybookSoundFx = {
      click: playMeowSound,
      meow: playMeowSound,
      hover: playHoverSound
    };
  })();
</script>
