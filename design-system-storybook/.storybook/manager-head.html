<!-- Google Analytics 4 (GA4) Tracking for Storybook Manager -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-02V3ZNFL0V"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-02V3ZNFL0V', {
    send_page_view: true
  });

  // Track Storybook URL changes in manager shell
  let lastUrl = location.href;
  new MutationObserver(() => {
    const url = location.href;
    if (url !== lastUrl) {
      lastUrl = url;
      if (typeof gtag === 'function') {
        gtag('event', 'page_view', {
          page_title: document.title,
          page_location: url,
          page_path: window.location.pathname + window.location.search + window.location.hash
        });
      }
    }
  }).observe(document, { subtree: true, childList: true });
</script>

<!-- Web Audio API Global Sound Effects for Storybook Manager UI -->
<script>
  (function() {
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    ['click', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, function unlock() {
        initAudio();
        window.removeEventListener(evt, unlock);
      }, { once: true });
    });

    function playClickSound() {
      const ctx = initAudio();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.exponentialRampToValueAtTime(350, now + 0.07);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.07);
      } catch (e) {}
    }

    document.addEventListener('click', function() {
      playClickSound();
    }, true);
  })();
</script>
